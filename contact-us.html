<!doctype html>
<html lang="en-US">

    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Contact Us — Here, My Voice</title>

    <link
      href="https://assets.squarespace.com/universal/default-favicon.ico"
      rel="icon"
      type="image/x-icon"
    />

    <meta content="Here, My Voice" property="og:site_name" />

    <meta content="Contact Us — Here, My Voice" property="og:title" />

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Karla:ital,wght@0,400;0,700;1,400;1,700&family=Poppins:ital,wght@0,400;0,500;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />

    <!-- 本地頁面樣式表 -->

    <style>
      body,
      button,
      input,
      textarea,
      select {
        font-family: "Poppins", "Karla", sans-serif;
        margin: 0;
        color: #111111;
        background-color: #ffffff;
      }

      .header-title,
      #site-title {
        font-family: "Caveat", cursive !important;
        font-size: 1.7rem !important;
        font-weight: 500;
      }

      header.header,
      .site-header {
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
      }

      main.container,
      #page {
        padding-top: 124px;
      }

      .content-wrapper {
        max-width: 1200px;
        margin: 0 auto;
        box-sizing: border-box;
      }

      /* 聯絡主區塊 */
      .contact-section {
        width: 100%;
        padding: 4.5rem 4vw 6rem;
        box-sizing: border-box;
      }

      .contact-grid {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 5fr) minmax(0, 1fr) minmax(0, 6fr);
        gap: 2rem;
        align-items: start;
      }

      .contact-heading {
        font-family: "Poppins", sans-serif;
        font-size: clamp(1.8rem, 2.8vw, 2.35rem);
        font-weight: 700;
        line-height: 1.25;
        margin: 0 0 1.5rem 0;
        color: #111111;
      }

      .contact-info-text {
        font-family: "Karla", sans-serif;
        font-size: 1.05rem;
        line-height: 1.8;
        color: #333333;
        margin: 0 0 0.65rem 0;
      }

      .contact-email-link {
        color: #111111;
        text-decoration: underline;
        text-underline-offset: 4px;
      }

      .contact-email-link:hover {
        opacity: 0.72;
      }

      /* 聯絡表單 */
      .contact-form {
        display: flex;
        flex-direction: column;
        gap: 1.75rem;
      }

      .form-field {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .form-label {
        font-family: "Poppins", sans-serif;
        font-size: 0.92rem;
        font-weight: 500;
        color: #111111;
      }

      .form-required {
        font-family: "Karla", sans-serif;
        font-size: 0.85rem;
        color: #666666;
        margin-left: 0.25rem;
      }

      .form-input,
      .form-textarea {
        width: 100%;
        box-sizing: border-box;
        font-family: "Karla", sans-serif;
        font-size: 1rem;
        color: #111111;
        background-color: transparent;
        border: none;
        border-bottom: 1px solid #999999;
        padding: 0.65rem 0.25rem;
        transition: border-color 0.2s ease;
      }

      .form-input:focus,
      .form-textarea:focus {
        outline: none;
        border-bottom-color: #111111;
      }

      .form-textarea {
        min-height: 130px;
        resize: vertical;
        line-height: 1.65;
      }

      .form-actions {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-top: 0.25rem;
      }

      .form-submit-btn {
        font-family: "Poppins", sans-serif;
        font-size: 0.98rem;
        font-weight: 500;
        color: #ffffff;
        background-color: #111111;
        border: none;
        border-radius: 4px;
        padding: 0.8rem 2.25rem;
        cursor: pointer;
        transition: opacity 0.2s ease;
      }

      .form-submit-btn:hover:not(:disabled) {
        opacity: 0.85;
      }

      .form-submit-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .form-status {
        font-family: "Karla", sans-serif;
        font-size: 0.98rem;
        line-height: 1.6;
        margin: 0;
        min-height: 1.5rem;
      }

      .form-status--success {
        color: #155724;
        font-weight: 700;
      }

      .form-status--error {
        color: #842029;
      }

      @media (max-width: 860px) {
        .contact-grid {
          grid-template-columns: 1fr;
          gap: 2.5rem;
        }

        .contact-spacer {
          display: none;
        }
      }
    </style>
  </head>

                      </div>
                      <div class="header-nav-item header-nav-item--collection">

            <!-- 手機版 Header -->
            <div class="header-display-mobile" data-content-field="site-title">
              <div class="header-title-nav-wrapper">
                <div class="header-title" data-animation-role="header-element">
                  <div class="header-title-text">
                    <a
                      id="site-title"
                      href="index.html"
                      data-animation-role="header-element"
                      >Here, My Voice</a
                    >
                  </div>
                </div>
                <div class="header-nav">
                  <div class="header-nav-wrapper">
                    <nav class="header-nav-list">
                      <div class="header-nav-item header-nav-item--collection">
                        <a
                          href="about.html"

                        >

                      <div class="header-nav-item header-nav-item--collection">

                          href="participants.html"

                      <div class="header-nav-item header-nav-item--collection">

      <!-- 主要內容 Main -->
      <main class="container" id="page" role="main">
        <section class="contact-section">
          <div class="contact-grid">
            <!-- 左欄：聯絡資訊 -->
            <div>
              <h1 class="contact-heading">Contact us.</h1>

              <p class="contact-info-text">
                <a
                  class="contact-email-link"
                  href="mailto:heremyvoiceusc@gmail.com"
                  >heremyvoiceusc@gmail.com</a
                >
              </p>
              <p class="contact-info-text">USC School of Cinematic Arts</p>
            </div>

            <!-- 中間留白 -->
            <div class="contact-spacer" aria-hidden="true"></div>

            <!-- 右欄：聯絡表單 -->
            <div>
              <!-- 將 YOUR_FORMSPREE_ID 替換為你的 Formspree 表單 Endpoint ID（例如 fxyzabcd） -->
              <form
                id="contactForm"
                class="contact-form"
                action="https://formspree.io/f/YOUR_FORMSPREE_ID"
                method="POST"
                novalidate
              >
                <div class="form-field">
                  <label class="form-label" for="senderName">
                    Name <span class="form-required">(required)</span>
                  </label>
                  <input
                    id="senderName"
                    name="name"
                    type="text"
                    class="form-input"
                    autocomplete="name"
                    required
                  />
                </div>

                <div class="form-field">
                  <label class="form-label" for="senderEmail">
                    Email <span class="form-required">(required)</span>
                  </label>
                  <input
                    id="senderEmail"
                    name="email"
                    type="email"
                    class="form-input"
                    autocomplete="email"
                    required
                  />
                </div>

                <div class="form-field">
                  <label class="form-label" for="senderMessage">
                    Message <span class="form-required">(required)</span>
                  </label>
                  <textarea
                    id="senderMessage"
                    name="message"
                    class="form-textarea"
                    required
                  ></textarea>
                </div>

                <!-- 蜜罐防垃圾訊息欄位 -->
                <input
                  type="text"
                  name="_gotcha"
                  style="display: none"
                  tabindex="-1"
                  autocomplete="off"
                />

                <div class="form-actions">
                  <button id="submitBtn" type="submit" class="form-submit-btn">
                    Send
                  </button>
                </div>

                <p
                  id="formStatus"
                  class="form-status"
                  role="status"
                  aria-live="polite"
                ></p>
              </form>
            </div>
          </div>
        </section>

      <!-- 頁尾 Footer -->

        class="sections"
        id="footer-sections"
        style="padding: 60px 0; background-color: #ebebeb"
      >
        <div class="content-wrapper">
          <div
            class="content"
            style="
              max-width: 1200px;
              margin: 0 auto;
              display: flex;
              justify-content: space-between;
            "
          >
            <div>
              <p class="sqsrte-small">A USC Arts in Action project.</p>

              <h3>Here, My Voice</h3>
            </div>
            <div>
              <p class="sqsrte-small">About</p>

              <p class="sqsrte-small">Student Teams</p>

              <p class="sqsrte-small">Podcasts</p>

              <p class="sqsrte-small">Research</p>
            </div>
          </div>
        </div>

    <script>
      (function () {
        const form = document.getElementById("contactForm");
        const submitBtn = document.getElementById("submitBtn");
        const statusEl = document.getElementById("formStatus");

        if (!form || !submitBtn || !statusEl) return;

        function setStatus(message, type) {
          statusEl.textContent = message;
          statusEl.className = "form-status";
          if (type) {
            statusEl.classList.add("form-status--" + type);
          }
        }

        form.addEventListener("submit", async function (event) {
          event.preventDefault();

          const nameVal = document.getElementById("senderName").value.trim();
          const emailVal = document.getElementById("senderEmail").value.trim();
          const messageVal = document
            .getElementById("senderMessage")
            .value.trim();
          const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

          if (!nameVal) {
            setStatus("Please enter your name.", "error");
            document.getElementById("senderName").focus();
            return;
          }

          if (!emailVal || !emailPattern.test(emailVal)) {
            setStatus(
              "Email addresses should follow the format user@domain.com.",
              "error",
            );
            document.getElementById("senderEmail").focus();
            return;
          }

          if (!messageVal) {
            setStatus("Please enter your message.", "error");
            document.getElementById("senderMessage").focus();
            return;
          }

          const endpoint = form.getAttribute("action");
          if (!endpoint || endpoint.includes("YOUR_FORMSPREE_ID")) {
            // 尚未填入 Formspree ID 時，改以 mailto 帶入主旨與內容開啟郵件程式
            const subject = encodeURIComponent(
              "Here, My Voice — Message from " + nameVal,
            );
            const body = encodeURIComponent(
              "Name: " + nameVal + "\nEmail: " + emailVal + "\n\n" + messageVal,
            );
            window.location.href =
              "mailto:heremyvoiceusc@gmail.com?subject=" +
              subject +
              "&body=" +
              body;
            setStatus(
              "Opened your mail client to send to heremyvoiceusc@gmail.com.",
              "success",
            );
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = "Sending...";
          setStatus("", "");

          try {
            const formData = new FormData(form);
            const response = await fetch(endpoint, {
              method: "POST",
              body: formData,
              headers: {
                Accept: "application/json",
              },
            });

            if (response.ok) {
              form.reset();
              setStatus("Thank you!", "success");
            } else {
              const data = await response.json().catch(function () {
                return {};
              });
              const errMsg =
                data && Array.isArray(data.errors) && data.errors.length > 0
                  ? data.errors
                      .map(function (item) {
                        return item.message;
                      })
                      .join(" ")
                  : "Unable to submit form. Please try again later.";
              setStatus(errMsg, "error");
            }
          } catch (err) {
            setStatus(
              "Unable to submit form. Please try again later.",
              "error",
            );
          } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Send";
          }
        });
      })();
    </script>
