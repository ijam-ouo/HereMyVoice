<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta content="IE=edge,chrome=1" http-equiv="X-UA-Compatible" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Research — Here, My Voice</title>

    <link
      href="https://assets.squarespace.com/universal/default-favicon.ico"
      rel="icon"
      type="image/x-icon"
    />
    <link href="https://www.heremyvoice.org/research" rel="canonical" />
    <meta content="Here, My Voice" property="og:site_name" />
    <meta content="Research — Here, My Voice" property="og:title" />
    <meta content="https://www.heremyvoice.org/research" property="og:url" />
    <meta content="website" property="og:type" />
    <meta content="" name="description" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Karla:ital,wght@0,400;0,700;1,400;1,700&family=Poppins:ital,wght@0,400;0,500;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />

    <!-- 本地頁面樣式表 -->
    <link href="style/research.css" rel="stylesheet" />

    <style>
      body,
      button,
      input,
      textarea,
      select {
        font-family: "Poppins", "Karla", sans-serif;
        margin: 0;
        color: #111111;
        background-color: #ffffff;
      }

      .header-title,
      #site-title {
        font-family: "Caveat", cursive !important;
        font-size: 1.7rem !important;
        font-weight: 500;
      }

      header.header,
      .site-header {
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
      }

      main.container,
      #page {
        padding-top: 124px;
      }

      .content-wrapper {
        max-width: 1200px;
        margin: 0 auto;
        box-sizing: border-box;
      }

      /* Research 主區塊（原始頁面此區為空白，保留基本版面高度） */
      .research-section {
        width: 100%;
        min-height: 45vh;
        padding: 4.5rem 4vw 6rem;
        box-sizing: border-box;
      }

      .research-container {
        max-width: 1100px;
        margin: 0 auto;
      }

      .research-header {
        text-align: center;
        margin-bottom: 1.75rem;
      }

      .research-title {
        font-family: "Poppins", sans-serif;
        font-size: clamp(1.75rem, 2.6vw, 2.25rem);
        font-weight: 700;
        line-height: 1.25;
        margin: 0 0 0.35rem 0;
        color: #111111;
      }

      .research-status {
        font-family: "Poppins", sans-serif;
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.5;
        margin: 0;
        color: #333333;
      }
      .research-intro {
        max-width: 820px;
        margin: 0 auto 3.5rem;
        font-family: "Karla", sans-serif;
        font-size: 1.05rem;
        line-height: 1.8;
        color: #333333;
      }
    </style>
  </head>

  <body class="research-page">
    <div class="clearfix site-wrapper" id="siteWrapper">
      <!-- 導覽列 Header -->
      <header
        data-test="header"
        id="header"
        class="white-bold header theme-col--primary"
        data-section-theme="white-bold"
        data-controller="Header"
        data-section-id="header"
        data-header-style="theme"
        tabindex="-1"
      >
        <div class="sqs-announcement-bar-dropzone"></div>

        <div class="header-announcement-bar-wrapper">
          <a href="#page" class="header-skip-link sqs-button-element--primary">
            Skip to Content
          </a>

          <div
            class="header-border"
            data-header-style="theme"
            data-header-border="false"
            data-test="header-border"
          ></div>
          <div
            class="header-dropshadow"
            data-header-style="theme"
            data-header-dropshadow="false"
            data-test="header-dropshadow"
          ></div>

          <div
            class="header-inner container--fluid header-mobile-layout-logo-left-nav-right header-layout-nav-right"
            data-test="header-inner"
          >
            <div class="header-background theme-bg--primary"></div>

            <div class="header-display-desktop" data-content-field="site-title">
              <div class="header-title-nav-wrapper">
                <div class="header-title" data-animation-role="header-element">
                  <div class="header-title-text">
                    <a
                      id="site-title"
                      href="index.html"
                      data-animation-role="header-element"
                      >Here, My Voice</a
                    >
                  </div>
                </div>

                <div class="header-nav">
                  <div class="header-nav-wrapper">
                    <nav class="header-nav-list">
                      <div class="header-nav-item header-nav-item--collection">
                        <a
                          href="about.html"
                          data-animation-role="header-element"
                          >About</a
                        >
                      </div>
                      <div class="header-nav-item header-nav-item--collection">
                        <a
                          href="participants.html"
                          data-animation-role="header-element"
                          >Participants</a
                        >
                      </div>
                      <div class="header-nav-item header-nav-item--collection">
                        <a
                          href="podcasts.html"
                          data-animation-role="header-element"
                          >Podcasts</a
                        >
                      </div>
                      <div
                        class="header-nav-item header-nav-item--collection header-nav-item--active"
                      >
                        <a
                          aria-current="page"
                          href="research.html"
                          data-animation-role="header-element"
                          >Research</a
                        >
                      </div>
                      <div class="header-nav-item header-nav-item--collection">
                        <a
                          href="contact-us.html"
                          data-animation-role="header-element"
                          >Contact Us</a
                        >
                      </div>
                    </nav>
                  </div>
                </div>
              </div>

              <div class="header-actions header-actions--right">
                <div class="showOnMobile"></div>
                <div class="showOnDesktop"></div>
              </div>

              <div
                class="header-burger menu-overlay-has-visible-non-navigation-items no-actions"
                data-animation-role="header-element"
              >
                <button
                  class="header-burger-btn burger"
                  data-test="header-burger"
                >
                  <span
                    hidden
                    class="js-header-burger-open-title visually-hidden"
                    >Open Menu</span
                  >
                  <span
                    hidden
                    class="js-header-burger-close-title visually-hidden"
                    >Close Menu</span
                  >
                  <div class="burger-box">
                    <div
                      class="burger-inner header-menu-icon-doubleLineHamburger"
                    >
                      <div class="top-bun"></div>
                      <div class="patty"></div>
                      <div class="bottom-bun"></div>
                    </div>
                  </div>
                </button>
              </div>
            </div>

            <!-- 手機版 Header -->
            <div class="header-display-mobile" data-content-field="site-title">
              <div class="header-title-nav-wrapper">
                <div class="header-title" data-animation-role="header-element">
                  <div class="header-title-text">
                    <a
                      id="site-title"
                      href="index.html"
                      data-animation-role="header-element"
                      >Here, My Voice</a
                    >
                  </div>
                </div>
                <div class="header-nav">
                  <div class="header-nav-wrapper">
                    <nav class="header-nav-list">
                      <div class="header-nav-item header-nav-item--collection">
                        <a
                          href="about.html"
                          data-animation-role="header-element"
                          >About</a
                        >
                      </div>
                      <div class="header-nav-item header-nav-item--collection">
                        <a
                          href="participants.html"
                          data-animation-role="header-element"
                          >Participants</a
                        >
                      </div>
                      <div class="header-nav-item header-nav-item--collection">
                        <a
                          href="podcasts.html"
                          data-animation-role="header-element"
                          >Podcasts</a
                        >
                      </div>
                      <div
                        class="header-nav-item header-nav-item--collection header-nav-item--active"
                      >
                        <a
                          aria-current="page"
                          href="research.html"
                          data-animation-role="header-element"
                          >Research</a
                        >
                      </div>
                      <div class="header-nav-item header-nav-item--collection">
                        <a
                          href="contact-us.html"
                          data-animation-role="header-element"
                          >Contact Us</a
                        >
                      </div>
                    </nav>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- 主要內容 Main -->
      <main class="container" id="page" role="main">
        <section class="research-section">
          <div class="research-container">
            <div class="research-header">
              <h1 class="research-title">Research</h1>
              <p class="research-status">(Under construction)</p>
            </div>
            <p class="research-intro"></p>
          </div>
        </section>
      </main>

      <!-- 頁尾 Footer -->
      <footer
        class="sections"
        id="footer-sections"
        style="padding: 60px 0; background-color: #ebebeb"
      >
        <div class="content-wrapper">
          <div
            class="content"
            style="
              max-width: 1200px;
              margin: 0 auto;
              display: flex;
              justify-content: space-between;
            "
          >
            <div>
              <p class="sqsrte-small">A USC Arts in Action project.</p>
              <h3>Here, My Voice</h3>
            </div>
            <div>
              <p class="sqsrte-small">About</p>
              <p class="sqsrte-small">Student Teams</p>
              <p class="sqsrte-small">Podcasts</p>
              <p class="sqsrte-small">Research</p>
            </div>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
